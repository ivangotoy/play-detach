UPSTREAM_URL=https://github.com/nikakvo/play-detach.git
UPSTREAM_BRANCH=main
ZIP_PREFIX=play-detach
VERSION_CODE_FLOOR=18
VERSION_CODE_OFFSET=5
CHANGELOG_PATH=CHANGELOG.md
build() {
    # The tests first, as the build user (this step has no forge token): a
    # failure ends the job before anything is released. Scratch in the build
    # area; the module scripts run under bash (the image's sh is dash, which
    # has no read -t; phones use mksh or busybox).
    mkdir -p "$HOME/tmp"
    TMPDIR="$HOME/tmp" SH=bash sh tests/run.sh
    ANDROID_NDK_HOME=/opt/android-sdk/ndk/29.0.14206865 OUT_DIR="$OUT/build" bash build.sh
    mv "$OUT"/build/play-detach-*.zip "$OUT/module.zip"
}
